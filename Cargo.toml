[workspace]
resolver = "2"
members = [
    "sigma-test-util",
    "sigma-ser",
    "sigma-util",
    "ergoscript-compiler",
    "ergotree-ir",
    "ergotree-interpreter",
    "ergo-lib",
    "ergo-p2p",
    "ergo-chain-generation",
    "ergo-rest",
    "ergo-chain-types",
    "ergo-nipopow",
    "ergo-merkle-tree",
    "gf2_192",
    "bindings/ergo-lib-wasm",
    "bindings/ergo-lib-c-core",
    "bindings/ergo-lib-c",
    "bindings/ergo-lib-jni",
    "bindings/ergo-lib-python",
]

[workspace.package]
repository = "https://github.com/ergoplatform/sigma-rust"
edition = "2021"

[workspace.dependencies]
sigma-util = { version = "^0.19.0", path = "./sigma-util" }
sigma-ser = { version = "^0.20.0", path = "./sigma-ser", default-features = false }
ergotree-ir = { version = "^0.29.0", path = "./ergotree-ir", default-features = false }
ergo-chain-types = { version = "^0.16.0", path = "./ergo-chain-types", default-features = false }
sigma-test-util = { version = "^0.4.0", path = "./sigma-test-util" }
ergoscript-compiler = { version = "^0.25.0", path = "./ergoscript-compiler" }
ergotree-interpreter = { version = "^0.29.0", path = "./ergotree-interpreter", default-features = false }
ergo-nipopow = { version = "^0.16.0", path = "./ergo-nipopow" }
ergo-merkle-tree = { version = "^0.16.0", path = "./ergo-merkle-tree", default-features = false }
ergo-rest = { version = "^0.14.0", path = "./ergo-rest" }
ergo-lib = { version = "^0.29.0", path = "./ergo-lib" }
k256 = { version = "0.13.1", default-features = false, features = [
    "arithmetic",
    "ecdsa",
] }
elliptic-curve = { version = "0.13", features = ["ff"] }
derive_more = { version = "2.0.1", default-features = false, features = [
    "as_ref",
    "add",
    "add_assign",
    "mul",
    "not",
    "from",
    "into",
    "try_into",
    "from_str",
    "display",
    "debug",
    "sum",
] }
num-derive = "0.4.2"
thiserror = { version = "2.0.1", default-features = false }
bounded-vec = { version = "0.9.0", default-features = false }
bitvec = { version = "1.0.1", default-features = false, features = ["alloc"] }
blake2 = { version = "0.10.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
num-integer = { version = "0.1.44", default-features = false }
num-bigint = { version = "0.4.0", default-features = false }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
base16 = { version = "0.2.1", default-features = false, features = ["alloc"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
indexmap = { version = "2.6.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = [
    "arbitrary_precision",
] }
serde_with = { version = "3.11.0", default-features = false, features = [
    "json",
    "macros",
] }
rand = "0.8.5"
bytes = { version = "1.1", default-features = false }
futures = "0.3"
tokio = { version = "1.15.0", default-features = false, features = ["rt", "rt-multi-thread"] }
tokio-stream = { version = "0.1.8", features = ["sync", "time"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
bounded-integer = { version = "0.6.1" }
url = "2.5.4"
getrandom = { version = "0.2.16" }
itertools = { version = "0.14", default-features = false }
miette = { version = "7.6.0", features = ["fancy"] }
hashbrown = { version = "0.16.1", features = ["serde"] }
# core2 0.4.0 (and all core2 releases) are yanked upstream. core3 0.1.2 is the latest
# non-yanked release of its successor; audited against core2 0.4.0 with no
# serialization-semantic difference for the enabled features. Exact pin prevents silent
# drift to future 0.1.x releases.
core3 = { version = "=0.1.2", default-features = false, features = ["alloc"] }
# dev-dependencies
proptest = { version = "=1.6.0", default-features = false, features = [
    "alloc",
    "std",
] }
proptest-derive = "0.5.1"
pretty_assertions = "1.3"
wasm-bindgen-test = "0.3.76"
expect-test = "1.4.1"
criterion = { version = "0.5.1", features = ["default", "cargo_bench_support"] }

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
