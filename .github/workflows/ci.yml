name: Tests

"on":
  push:
    branches:
      - master
      - develop
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  build_wo_default_features:
    name: Build without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          override: true
      - name: Build ergotree-ir
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --no-default-features --manifest-path ergotree-ir/Cargo.toml
      - name: Build ergo-lib
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: rustc
          args: --target thumbv7m-none-eabi --no-default-features --manifest-path ergo-lib/Cargo.toml --crate-type rlib

  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: actions-rs/toolchain@v1
        with:
          override: true
      - uses: taiki-e/install-action@nextest
      - name: cargo fetch
        uses: actions-rs/cargo@v1
        with:
          command: fetch
      - name: Build tests
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --verbose --tests
      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: nextest
          args: run --verbose

  c_rest_callback_tests:
    name: C REST callback tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - name: Run C REST callback tests
        run: "cargo test -p ergo-lib-c-core --features rest rest::api::callback::tests::"

  test_coverage:
    name: Code coverage in tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          override: true
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Generate code coverage
        run: |
          cargo llvm-cov --lcov --output-path lcov.info --ignore-filename-regex "bindings/.*" nextest
      - name: Push code coverage results to coveralls.io
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info

  clippy:
    name: Clippy (linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          components: clippy
          override: true
      - name: Check with Clippy
        uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features --all-targets -- -D warnings

  js_tests:
    name: Run JS tests and publish alpha versions
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    # Service containers to run `ergo` node in `devnet` mode
    services:
      # Label used to access the service container
      ergo_node:
        # Docker Hub image
        image: ergoplatform/ergo-devnet:latest
        ports:
          # Maps tcp port 9053 on service container to the host
          - 9053:9053

    steps:
      # Need the following command to get around a GA bug where the workspace can't be cleared due
      # to incorrect access permissions. This comes up due to the use of the service container
      # above. See https://github.com/actions/checkout/issues/211
      - name: set_file_permissions
        run: sudo chown -R $USER:$USER ${{ github.workspace }}

      - name: checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.1

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true

      - name: install deps
        run: |
          cd bindings/ergo-lib-wasm
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh -s -- -f

      - name: run Wasm tests
        run: |
          cd bindings/ergo-lib-wasm
          wasm-pack build
          wasm-pack test --node
          wasm-pack test --node --release

      - name: run node JS tests
        run: |
          cd bindings/ergo-lib-wasm
          wasm-pack build
          npm install
          npm run test

      - name: run browser JS tests
        run: |
          cd bindings/ergo-lib-wasm
          wasm-pack build
          npm install
          npm run test-browser

      - name: build alpha versions
        run: |
          cd bindings/ergo-lib-wasm
          npm run build-nodejs-alpha
          npm run build-browser-alpha

      - name: check generated TypeScript declarations
        working-directory: bindings/ergo-lib-wasm
        run: npm run test-types

      - name: publish nodejs alpha version to npm
        if: github.event_name == 'push' && env.HAS_NPM_TOKEN == 'true'
        uses: JS-DevTools/npm-publish@v1
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: ./bindings/ergo-lib-wasm/pkg-nodejs/package.json
          tag: "alpha"

      - name: publish browser alpha version to npm
        if: github.event_name == 'push' && env.HAS_NPM_TOKEN == 'true'
        uses: JS-DevTools/npm-publish@v1
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: ./bindings/ergo-lib-wasm/pkg-browser/package.json
          tag: "alpha"

  rustfmt:
    name: Code formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          components: rustfmt
          override: true
      - name: Check formatting
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check --color always

  doc-links:
    name: Check intra-documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          override: true
      - name: cargo fetch
        uses: actions-rs/cargo@v1
        with:
          command: fetch
      # Ensure intra-documentation links all resolve correctly
      # Requires #![deny(broken_intra_doc_links)] in crate.
      - name: Check intra-doc links
        uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --document-private-items --no-deps

  ios_tests:
    name: Test Swift(iOS) bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Service containers to run `ergo` node in `devnet` mode
    services:
      # Label used to access the service container
      ergo_node:
        # Docker Hub image
        image: ergoplatform/ergo-devnet:latest
        ports:
          # Maps tcp port 9053 on service container to the host
          - 9053:9053

    steps:
      # Need the following command to get around a GA bug where the workspace can't be cleared due
      # to incorrect access permissions. This comes up due to the use of the service container
      # above. See https://github.com/actions/checkout/issues/211
      - name: set_file_permissions
        run: sudo chown -R $USER:$USER ${{ github.workspace }}

      - name: checkout
        uses: actions/checkout@v4

      - uses: fwal/setup-swift@v2

      - uses: dtolnay/rust-toolchain@1.91.1

      - name: install nightly toolchain for cbindgen
        run: rustup toolchain install nightly --profile minimal

      - name: install deps
        run: cargo install cbindgen

      - name: generate C-bindings header file
        run: |
          cd bindings/ergo-lib-c
          RUSTUP_TOOLCHAIN=nightly cbindgen --config cbindgen.toml --crate ergo-lib-c --output h/ergo_lib.h

      - name: build and run tests
        run: |
          cargo build --all-features -p ergo-lib-c
          cd bindings/ergo-lib-ios
          swift test -Xlinker -L../../target/debug/

  android_tests:
    name: Test JNI(Android) bindings
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions-rs/toolchain@v1
        with:
          override: true

      - name: install deps
        run: |
          rustup target add armv7-linux-androideabi   # for arm
          rustup target add i686-linux-android        # for x86
          rustup target add aarch64-linux-android     # for arm64
          rustup target add x86_64-linux-android      # for x86_64

      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          ndk: 26.2.11394342
          emulator-build: 6110076
          script: cd ./bindings/ergo-lib-jni && ./gradlew connectedCheck
